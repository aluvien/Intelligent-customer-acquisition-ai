name: xinglian-yunke

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [app]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [app]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      COZE_API_URL: ${COZE_API_URL:-}
      COZE_BOT_ID: ${COZE_BOT_ID:-}
      COZE_TOKEN: ${COZE_TOKEN:-}
    command: ["sh", "-c", "npm run migrate && npm start"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["3001"]
    restart: unless-stopped
    networks: [app]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on: [backend]
    restart: unless-stopped
    networks: [app]

  # 平台适配器只在 T7/T8 真实核验通过后按需启动：docker compose --profile platform up。
  proxy:
    profiles: [platform]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379
      DOUYIN_APP_ID: ${DOUYIN_APP_ID:-}
      DOUYIN_APP_SECRET: ${DOUYIN_APP_SECRET:-}
      REDIRECT_URI: ${DOUYIN_REDIRECT_URI:-}
    expose: ["8080"]
    depends_on:
      redis: { condition: service_healthy }
    networks: [app]

volumes:
  postgres_data:
  redis_data:

networks:
  app:
    driver: bridge
